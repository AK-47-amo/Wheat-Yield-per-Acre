data:
  raw_train_path: "data/raw/train.csv"
  raw_later_path: "data/raw/later.csv"
  holdout_path: "data/raw/holdout_features.csv"
  predictions_path: "predictions/holdout_predictions.csv"

train:
  random_state: 42
  test_size: 0.2
  n_estimators: 100
  max_depth: 8
  learning_rate: 0.05

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "wheat_yield_mp130"
  registered_model_name: "wheat_yield_mp130"
  alias: "champion"

service:
  host: "0.0.0.0"
  port: 8000
