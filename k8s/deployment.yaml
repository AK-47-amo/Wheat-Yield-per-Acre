apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp130-api
  labels:
    app: mp130-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp130-api
  template:
    metadata:
      labels:
        app: mp130-api
    spec:
      containers:
      - name: mp130-api
        image: mp130-api:1.0
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
